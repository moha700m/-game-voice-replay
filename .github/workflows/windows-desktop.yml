name: Windows Desktop Build

on:
  push:
    branches: [windows-desktop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build web renderer
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Game-Voice-Replay-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
